name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two guards, both required.
    #
    # The author_association check is the important one: this repository is public,
    # so without it any GitHub user could post "@claude" on an issue and spend the
    # ANTHROPIC_API_KEY stored in this repo's secrets. Restricting to OWNER,
    # MEMBER and COLLABORATOR means only people with write access can invoke it.
    # Remove this line only if you actually want drive-by contributors to be able
    # to trigger billed runs.
    #
    # The second block is the upstream trigger-phrase check: the events above fire
    # on every comment, so each event type has to be inspected for "@claude" in the
    # field that actually carries the text for that event.
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association || github.event.review.author_association) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticates against the Claude Pro/Max subscription rather than a
          # pay-as-you-go Console API key, so runs do not bill separately.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
